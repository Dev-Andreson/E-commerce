<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrauTec Shop — E-commerce Poliglota</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <header>
    <div class="logo">GrauTec<span>Shop</span></div>
    <div class="header-actions">
      <button id="btn-catalogo" class="btn-ghost">Catálogo</button>
      <button id="btn-pedidos" class="btn-ghost hidden">Meus Pedidos</button>
      <button id="btn-novo-produto" class="btn-primary hidden">+ Novo Produto</button>
      <button id="btn-carrinho" class="btn-primary hidden">
        Carrinho <span id="cart-count">0</span>
      </button>
      <button id="btn-logout" class="btn-ghost hidden">Sair</button>
    </div>
  </header>

  <main>
    <section id="tela-auth">
      <div class="auth-card">
        <div class="auth-tabs">
          <button id="tab-login" class="active">Entrar</button>
          <button id="tab-register">Cadastrar</button>
        </div>

        <form id="form-login">
          <div class="field">
            <label>E-mail</label>
            <input type="email" name="email" required placeholder="voce@email.com" />
          </div>
          <div class="field">
            <label>Senha</label>
            <input type="password" name="password" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn-primary btn-block">Entrar</button>
        </form>

        <form id="form-register" class="hidden">
          <div class="field">
            <label>Nome</label>
            <input type="text" name="name" required placeholder="Seu nome" />
          </div>
          <div class="field">
            <label>E-mail</label>
            <input type="email" name="email" required placeholder="voce@email.com" />
          </div>
          <div class="field">
            <label>Senha</label>
            <input
              type="password"
              name="password"
              required
              minlength="8"
              placeholder="mín. 8 caracteres, 1 letra e 1 número"
            />
          </div>
          <div class="field">
            <label>Tipo de conta</label>
            <select name="role" required>
              <option value="cliente">Cliente — comprar produtos</option>
              <option value="admin">Administrador — cadastrar produtos</option>
            </select>
          </div>
          <button type="submit" class="btn-primary btn-block">Criar conta</button>
        </form>
      </div>
    </section>

    <section id="tela-catalogo" class="hidden">
      <h2 class="section-title">🛍️ Catálogo</h2>
      <div id="produtos" class="grid">
        <div class="loading">Carregando produtos...</div>
      </div>
    </section>

    <section id="tela-pedidos" class="hidden">
      <h2 class="section-title">📦 Meus Pedidos</h2>
      <div id="pedidos-lista">
        <div class="loading">Carregando pedidos...</div>
      </div>
    </section>
  </main>

  <div id="cart-overlay" class="cart-overlay"></div>
  <aside id="cart-sidebar" class="cart-sidebar">
    <div class="cart-header">
      <h3>🛒 Carrinho</h3>
      <button id="cart-close" class="btn-ghost">✕</button>
    </div>
    <div id="cart-itens" class="cart-itens">
      <div class="cart-empty">Seu carrinho está vazio</div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total">R$ 0,00</span>
      </div>
      <button id="btn-checkout" class="btn-primary btn-block" disabled>
        Finalizar compra
      </button>
    </div>
  </aside>

  <div id="modal-produto" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Novo Produto</h3>
        <button id="modal-close" class="btn-ghost">✕</button>
      </div>

      <form id="form-produto">
        <div class="field">
          <label>Nome</label>
          <input name="nome" required maxlength="100" placeholder="Ex: Fone Bluetooth" />
        </div>

        <div class="field">
          <label>Descrição</label>
          <textarea name="descricao" required maxlength="500" rows="3"
            placeholder="Breve descrição do produto"></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label>Preço (R$)</label>
            <input name="preco" type="number" step="0.01" min="0" required placeholder="0,00" />
          </div>
          <div class="field">
            <label>Estoque</label>
            <input name="estoque" type="number" min="0" value="0" required />
          </div>
        </div>

        <div class="field">
          <label>Categoria</label>
          <select name="categoria" required>
            <option value="">Selecione...</option>
            <option>Eletrónicos</option>
            <option>Roupas</option>
            <option>Alimentos</option>
            <option>Casa</option>
            <option>Outros</option>
          </select>
        </div>

        <button type="submit" class="btn-primary btn-block">Cadastrar produto</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
